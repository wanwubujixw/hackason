<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="解忧慢递邮局 —— 当你在校园里感到疲惫、烦躁或迷茫时，给你一封校园回信">
  <title>解忧慢递邮局</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✉️</text></svg>">
  <link rel="stylesheet" href="src/styles/global.css">
</head>
<body>
  <div id="app">
    <!-- ========== 页头 ========== -->
    <header class="site-header">
      <h1 class="site-title">✉️ 解忧慢递邮局</h1>
      <p class="site-subtitle">当你在校园里需要一点温暖时，我们会给你一封回信。</p>
      <button type="button" id="btn-open-favorites" class="btn btn-ghost">📮 我的收藏</button>
    </header>

    <main class="site-main">
      <!-- ========== 第 1 步：选择心情 ========== -->
      <section id="view-home" class="view is-active">
        <div class="card">
          <p class="step-label">第 1 步 · 此刻的心情</p>
          <h2 class="section-title">此刻的你，感觉怎么样？</h2>
          <p class="section-desc">选一个最接近的就好，没有标准答案。</p>
          <div id="mood-list" class="mood-grid"></div>
        </div>
      </section>

      <!-- ========== 第 2 步：时间 + 偏好 + 社交舒适度 ========== -->
      <section id="view-prefs" class="view">
        <div class="card">
          <p class="step-label">第 2 步 · 时间与偏好</p>
          <h2 class="section-title">你现在有多少时间？</h2>
          <p class="section-desc">按真实可用的时间选，不用勉强。</p>
          <div id="time-list" class="chip-row"></div>
        </div>

        <div class="card">
          <h2 class="section-title">想要一个什么样的地方？</h2>
          <p class="section-desc">可以多选，也可以都不选。</p>
          <div id="preference-list" class="chip-row"></div>
        </div>

        <div class="card">
          <h2 class="section-title">此刻想怎么和人相处？</h2>
          <p class="section-desc">人多或人少都可以，看你现在的状态。</p>
          <div id="social-list" class="chip-row"></div>
        </div>

        <p id="prefs-hint" class="hint" role="status"></p>

        <div class="actions">
          <button type="button" id="btn-generate" class="btn btn-primary btn-block">生成我的回信</button>
          <button type="button" id="btn-prefs-back" class="btn btn-secondary btn-block">上一步</button>
        </div>
      </section>

      <!-- ========== 第 3 步：推荐地点 ========== -->
      <section id="view-result" class="view">
        <div class="card">
          <p class="step-label">第 3 步 · 推荐地点</p>
          <h2 class="section-title">这些地方也许适合现在的你</h2>
          <p class="section-desc">选一个你想去的，就带回来一封回信。</p>
          <p id="result-notice" class="notice" hidden></p>
          <div id="scene-list" class="scene-list"></div>
        </div>

        <div class="actions">
          <button type="button" id="btn-result-back" class="btn btn-secondary btn-block">重新选择</button>
        </div>
      </section>

      <!-- ========== 回信卡 ========== -->
      <section id="view-letter" class="view">
        <div id="letter-card" class="letter-card"></div>

        <div class="actions actions-row">
          <button type="button" id="btn-fav" class="btn btn-secondary">✉️ 收藏</button>
          <button type="button" id="btn-fb-good" class="btn btn-secondary">👍 适合我</button>
          <button type="button" id="btn-fb-bad" class="btn btn-secondary">👎 不太适合我</button>
        </div>

        <div class="actions actions-row">
          <button type="button" id="btn-letter-back" class="btn btn-secondary">换一个地点</button>
          <button type="button" id="btn-letter-home" class="btn btn-secondary">回到首页</button>
        </div>
      </section>

      <!-- ========== 收藏列表 ========== -->
      <section id="view-favorites" class="view">
        <div class="card">
          <p class="step-label">我的收藏</p>
          <h2 class="section-title">收好的回信</h2>
          <div id="favorites-list" class="favorites-list"></div>
        </div>

        <div class="actions">
          <button type="button" id="btn-fav-back" class="btn btn-secondary btn-block">返回</button>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      解忧慢递邮局 · 收藏与反馈只保存在这台设备的浏览器里
    </footer>
  </div>

  <script type="module" src="src/pages/home.js"></script>
</body>
</html>
